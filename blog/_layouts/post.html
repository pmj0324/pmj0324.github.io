---
layout: default
---
<article class="post">
  <header class="post-header">
    <a class="back-link" href="{{ '/blog/' | relative_url }}">← All notes</a>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="post-deck">{{ page.description }}</p>{% endif %}
    {% if page.tags.size > 0 %}
      <ul class="tag-list" aria-label="Tags">
        {% for tag in page.tags %}<li>{{ tag }}</li>{% endfor %}
      </ul>
    {% endif %}
  </header>

  <div class="post-body">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="{{ '/blog/' | relative_url }}">Return to all notes</a>
  </footer>
</article>

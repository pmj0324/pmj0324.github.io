title: 까묵기 싫어서 하는 블로그
description: 공부하고, 논문을 읽고, 코드를 짜며 알게 된 것들을 기록하는 Minje Park의 블로그입니다.
url: https://pmj0324.github.io
baseurl: ""

markdown: kramdown
permalink: /blog/:year/:month/:day/:title/
timezone: Asia/Seoul

# Keep Jekyll's blog machinery inside the blog directory.
collections_dir: blog
layouts_dir: blog/_layouts
includes_dir: blog/_includes

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - NOTICE.md
  - README.md
  - blog/README.md
  - vendor

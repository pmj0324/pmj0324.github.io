<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Calendar · Minje Park</title>
    <link rel="stylesheet" href="assets/css/calendar.css" />
  </head>
  <body>
    <div class="page">
      <header class="navbar">
        <div class="page-inner navbar-inner">
          <div class="brand">
            <div>
              <div class="brand-text-main">Minje&nbsp;Park</div>
              <div class="brand-text-sub">Calendar</div>
            </div>
          </div>
          <nav class="nav-links" aria-label="Main navigation">
            <a class="nav-link" href="index.html">home</a>
            <a class="nav-link" href="about.html">about</a>
            <a class="nav-link" href="research.html">research</a>
            <a class="nav-link" href="blog/">blog</a>
            <a class="nav-link nav-link-active" href="calendar.html">calendar</a>
            <a class="nav-link" href="publications.html">publications</a>
            <a class="nav-link" href="game.html">game</a>
          </nav>
        </div>
      </header>

      <main class="page-inner">
        <section class="card" aria-labelledby="cal-heading">
          <div class="card-header">
            <h1 id="cal-heading" class="card-title">Calendar</h1>
            <span class="card-subtitle">Asia/Seoul</span>
          </div>

          <div class="calendar-shell">

            <!-- ── Left: Add panel ── -->
            <aside class="add-panel" aria-label="Add schedule item">
              <div class="panel-kicker">Adding to</div>
              <div class="panel-date" id="add-panel-date">—</div>
              <div class="panel-weekday" id="add-panel-weekday"></div>

              <div class="add-tabs">
                <button class="add-tab active" data-tab="schedule">Schedule</button>
                <button class="add-tab"        data-tab="todo">To-do</button>
                <button class="add-tab"        data-tab="note">Memo</button>
              </div>

              <!-- ── Tab: Schedule ── -->
              <div class="add-tab-panel active" data-tab="schedule">
                <label class="form-label" for="schedule-input">Schedule</label>
                <input type="text" class="schedule-input" id="schedule-input"
                  placeholder="Schedule group" list="schedule-list" autocomplete="off" />
                <datalist id="schedule-list"></datalist>

                <div class="color-picker-row" id="color-picker-row">
                  <div class="form-label" style="margin-top:6px">Color</div>
                  <div class="color-swatches" id="color-swatches"></div>
                  <div class="color-lock-note" id="color-lock-note" style="display:none"></div>
                </div>

                <label class="all-day-row">
                  <input type="checkbox" id="all-day-input" />
                  <span>All-day</span>
                </label>
                <label class="all-day-row">
                  <input type="checkbox" id="range-input" />
                  <span>Date range</span>
                </label>
                <div class="time-row" id="range-row" hidden>
                  <input type="date" class="time-input" id="range-end-input"
                    aria-label="Range end date" />
                </div>
                <div class="time-row" id="time-row">
                  <input type="time" class="time-input" id="start-input" aria-label="Start time" />
                  <input type="time" class="time-input" id="end-input"   aria-label="End time" />
                </div>
                <label class="important-row">
                  <input type="checkbox" id="important-input" />
                  <span>Important</span>
                </label>
                <div class="add-row">
                  <input type="text" class="add-input" id="add-input" placeholder="Title" />
                  <button class="cal-btn cal-btn-primary" id="add-btn">Add</button>
                </div>
                <textarea class="note-input note-input-sm" id="schedule-note-input"
                  placeholder="Add a note to this event…"></textarea>
              </div>

              <!-- ── Tab: To-do ── -->
              <div class="add-tab-panel" data-tab="todo">
                <label class="important-row" style="margin-top:2px">
                  <input type="checkbox" id="todo-important" />
                  <span>Important</span>
                </label>
                <label class="all-day-row">
                  <input type="checkbox" id="todo-range-input" />
                  <span>Date range</span>
                </label>
                <div class="time-row" id="todo-range-row" hidden>
                  <input type="date" class="time-input" id="todo-range-end-input"
                    aria-label="To-do range end date" />
                </div>
                <div class="add-row">
                  <input type="text" class="add-input" id="todo-input" placeholder="Add to-do…" />
                  <button class="cal-btn cal-btn-primary" id="todo-add-btn">Add</button>
                </div>
                <textarea class="note-input note-input-sm" id="todo-note-input"
                  placeholder="Add a note to this to-do…"></textarea>
              </div>

              <!-- ── Tab: Memo ── -->
              <div class="add-tab-panel" data-tab="note">
                <div class="memo-list" id="memo-list"></div>
                <hr class="memo-form-sep" />
                <div class="memo-form-title">New standalone memo</div>
                <input type="text" class="add-input" id="memo-title"
                  placeholder="Title (optional)" />
                <textarea class="note-input note-input-sm" id="memo-body"
                  placeholder="Write a standalone memo for this day…"
                  style="min-height:72px;margin-top:6px"></textarea>
                <label class="all-day-row">
                  <input type="checkbox" id="memo-range-input" />
                  <span>Date range</span>
                </label>
                <div class="time-row" id="memo-range-row" hidden>
                  <input type="date" class="time-input" id="memo-range-end-input"
                    aria-label="Memo range end date" />
                </div>
                <div class="memo-add-row">
                  <button class="cal-btn cal-btn-primary" id="memo-add-btn"
                    style="width:100%">Add memo</button>
                </div>
              </div>
            </aside>

            <!-- ── Center: Calendar ── -->
            <div class="calendar-main">
              <div class="cal-toolbar">
                <span class="cal-month-label" id="month-label"></span>
                <button class="cal-btn cal-btn-primary" id="btn-today">Today</button>
                <button class="cal-btn" id="btn-share">Share</button>
                <button class="cal-btn" id="btn-export">Backup</button>
                <button class="cal-btn" id="btn-import">Import</button>
                <input type="file" id="import-file" accept="application/json" style="display:none" />
                <span class="cal-spacer"></span>
                <button class="cal-btn" id="btn-anim">Stop</button>
              </div>

              <div class="schedule-strip" id="schedule-strip"></div>

              <div class="weekdays" id="weekdays"></div>
              <div class="cal-viewport" id="viewport">
                <div class="sentinel" id="sentinel-top"></div>
                <div class="weeks" id="weeks"></div>
                <div class="sentinel" id="sentinel-bottom"></div>
              </div>
            </div>

            <!-- ── Right: Overview panel ── -->
            <aside class="view-panel" aria-label="Schedule overview">
              <div class="panel-kicker">Today</div>
              <div class="panel-date" id="ov-today-date"></div>
              <div id="ov-today-list" style="margin-top:10px"></div>

              <div class="ov-section">
                <div class="ov-section-hdr">
                  <span class="ov-section-title">This week</span>
                  <span class="ov-section-tag">Important</span>
                </div>
                <div id="ov-week"></div>
              </div>

              <div class="ov-section">
                <div class="ov-section-hdr">
                  <span class="ov-section-title">Upcoming</span>
                  <span class="ov-section-tag" id="ov-upcoming-label"></span>
                </div>
                <div id="ov-upcoming"></div>
              </div>
            </aside>

          </div>
        </section>
      </main>

      <footer class="footer">
        <div class="footer-inner">
          <span>© <span id="year"></span> Minje Park. All rights reserved.</span>
          <span>Local calendar</span>
        </div>
      </footer>
    </div>

    <script src="assets/js/calendar.js"></script>
  </body>
</html>
